# Domestic DNS: encrypted DIRECT. Overseas DNS: existing main group.
# Node hostname bootstrap uses encrypted DIRECT to avoid circular resolution.
port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
ipv6: false
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: redir-host
  respect-rules: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  default-nameserver:
  - https://1.1.1.1/dns-query#🚀 主要节点
  - https://8.8.8.8/dns-query#🚀 主要节点
  nameserver:
  - https://1.1.1.1/dns-query#🚀 主要节点
  - https://8.8.8.8/dns-query#🚀 主要节点
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  nameserver-policy:
    geosite:cn,geolocation-cn,geolocation-!cn@cn:
    - https://223.5.5.5/dns-query#DIRECT
    - https://223.6.6.6/dns-query#DIRECT
    rule-set:DNS-ChinaDomain,DNS-JD,DNS-SteamCN:
    - https://223.5.5.5/dns-query#DIRECT
    - https://223.6.6.6/dns-query#DIRECT
rule-providers:
  GoogleCN:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google-cn.list
    path: ./rule_provider/GoogleCN.list
    interval: 86400
  DNS-ChinaDomain:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
    path: ./rule_provider/DNS-ChinaDomain.list
    interval: 86400
  DNS-JD:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ceeim/toolbox/master/clash/ruleset/JD.list
    path: ./rule_provider/DNS-JD.list
    interval: 86400
  DNS-SteamCN:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ceeim/toolbox/master/clash/ruleset/SteamCN.list
    path: ./rule_provider/DNS-SteamCN.list
    interval: 86400
proxies: []
proxy-groups: []
rules: []
