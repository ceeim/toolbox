; =============================================================================
; Cee Clash/OpenClash 订阅转换模板
; 作者: Cee | https://cee.im
; 项目: https://github.com/ceeim/toolbox/tree/master/clash
; 适用: OpenClash Meta 内核 | Redir-Host 模式 | 国内优先直连 + 海外默认代理
; =============================================================================
; 规则按从上到下的顺序匹配，先命中先生效
; 订阅转换远程配置 URL:
; https://raw.githubusercontent.com/ceeim/toolbox/master/clash/config/cee.ini
; =============================================================================

[custom]

; Keep third-party rule URLs and automatic updates; ruleset limit: 64.

; ── DNS 防绕过（OpenClash 的本地 DNS 劫持先于这些出口规则） ──
ruleset=REJECT,[]DST-PORT,53
ruleset=🚀 主要节点,[]DST-PORT,853

; ── 本地 / 局域网 ──
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve

; ── 广告过滤 ──
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

; ── PT 站点 / tracker 直连例外 ──
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,m-team.cc
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,m-team.io
ruleset=🎯 全球直连,[]GEOSITE,category-pt
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker

; ── 国内域名和 IP 优先直连，先于海外服务大类 ──
